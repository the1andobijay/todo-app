<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>To-Do List</h1>

    <form id="task-form" class="task-form">
      <label for="task-input">New task</label>
      <div class="task-form-row">
        <input id="task-input" type="text" autocomplete="off" placeholder="What needs doing?">
        <button type="submit">Add</button>
      </div>
      <p id="message" class="message" role="status" aria-live="polite"></p>
    </form>

    <div class="filters" role="group" aria-label="Filter tasks">
      <button type="button" data-filter="all" aria-pressed="true">All</button>
      <button type="button" data-filter="active" aria-pressed="false">Active</button>
      <button type="button" data-filter="completed" aria-pressed="false">Completed</button>
    </div>

    <ul id="task-list" class="task-list"></ul>
    <p id="empty-hint" class="empty-hint">No tasks yet</p>

    <p id="counter" class="counter" aria-live="polite">0 tasks left</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
